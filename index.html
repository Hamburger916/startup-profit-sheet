<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <meta name="description" content="填写项目收入与三项成本，自动计算利润的创业利润表。">
  <title>创业利润表</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23102a43'/%3E%3Cpath d='M15 45h34M19 39l9-10 8 6 11-16' fill='none' stroke='%23e5b95c' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --ink: #102a43;
      --muted: #627d98;
      --line: #d9e2ec;
      --paper: #ffffff;
      --wash: #f3f7fa;
      --gold: #c89536;
      --gold-soft: #fff7e6;
      --positive: #087e6a;
      --negative: #c23b4a;
      --shadow: 0 24px 60px rgba(16,42,67,.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #eef4f8 0%, #f8fafc 52%, #edf3f7 100%);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      font-size: 16px;
    }
    button, input { font: inherit; }
    .page { width: min(1160px, calc(100% - 32px)); margin: 0 auto; padding: 34px 0 44px; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .eyebrow { margin: 0 0 7px; color: var(--gold); font-size: .78rem; font-weight: 800; letter-spacing: .18em; }
    h1 { margin: 0; font-size: clamp(2rem, 4vw, 3.25rem); line-height: 1; letter-spacing: -.045em; }
    .save-note { color: var(--muted); font-size: .88rem; white-space: nowrap; }
    .save-dot { display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: var(--positive); vertical-align: 1px; }
    .project-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: stretch; margin-bottom: 16px; }
    .project-list { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 7px; scrollbar-width: thin; }
    .project-tab { min-width: 180px; border: 1px solid #d9e2ec; border-radius: 15px; background: rgba(255,255,255,.75); color: var(--ink); padding: 12px 14px; cursor: pointer; text-align: left; transition: .18s ease; }
    .project-tab:hover { border-color: #9fb3c8; transform: translateY(-1px); }
    .project-tab.active { border-color: var(--gold); background: white; box-shadow: 0 7px 20px rgba(16,42,67,.08); }
    .project-tab-name { display: block; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .86rem; font-weight: 800; }
    .project-tab-profit { display: block; margin-top: 4px; color: var(--muted); font-size: .76rem; }
    .add-project { align-self: start; border: 0; border-radius: 14px; background: var(--gold); color: #182b3b; padding: 14px 17px; font-weight: 800; cursor: pointer; box-shadow: 0 8px 20px rgba(200,149,54,.24); white-space: nowrap; }
    .add-project:hover { background: #d8a849; }
    .portfolio-total { display: flex; align-items: baseline; gap: 8px; margin: -5px 0 20px; color: #9fb3c8; }
    .portfolio-total strong { color: white; font-size: 1.1rem; }
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(320px, .65fr);
      overflow: hidden;
      border: 1px solid rgba(16,42,67,.09);
      border-radius: 26px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }
    .form-panel { padding: 30px; }
    .summary-panel {
      display: flex;
      flex-direction: column;
      min-height: 610px;
      padding: 30px;
      background: var(--ink);
      color: white;
    }
    .section-title { margin: 0 0 20px; font-size: 1rem; letter-spacing: .04em; }
    .project-grid { display: grid; grid-template-columns: 1.25fr .75fr; gap: 18px; margin-bottom: 26px; }
    label { display: block; color: #486581; font-size: .9rem; font-weight: 700; }
    input[type="text"], input[type="number"] {
      width: 100%;
      margin-top: 9px;
      border: 1px solid var(--line);
      border-radius: 13px;
      outline: none;
      background: #fbfdff;
      color: var(--ink);
      padding: 14px 15px;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }
    input:focus { border-color: var(--gold); background: white; box-shadow: 0 0 0 4px rgba(200,149,54,.13); }
    .upload {
      position: relative;
      display: grid;
      min-height: 132px;
      place-items: center;
      overflow: hidden;
      border: 1px dashed #9fb3c8;
      border-radius: 15px;
      background: var(--wash);
      cursor: pointer;
      text-align: center;
    }
    .upload:hover { border-color: var(--gold); }
    .upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .upload-copy { pointer-events: none; }
    .upload-icon { display: block; margin-bottom: 7px; font-size: 1.6rem; line-height: 1; }
    .upload strong { display: block; color: var(--ink); font-size: .9rem; }
    .upload small { color: var(--muted); font-size: .75rem; }
    #imagePreview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
    .money-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .field { position: relative; }
    .currency { position: absolute; left: 15px; bottom: 15px; color: #829ab1; font-weight: 700; }
    .field input { padding-left: 34px; }
    .revenue { grid-column: 1 / -1; }
    .revenue input { border-color: #ddc58f; background: var(--gold-soft); font-size: 1.08rem; font-weight: 800; }
    .summary-kicker { margin: 0 0 8px; color: #9fb3c8; font-size: .78rem; font-weight: 800; letter-spacing: .15em; }
    .summary-name { min-height: 30px; margin: 0 0 28px; font-size: 1.35rem; font-weight: 750; overflow-wrap: anywhere; }
    .hero-number { margin: 0; color: #f5d795; font-size: clamp(2.5rem, 6vw, 4.35rem); font-weight: 800; line-height: 1; letter-spacing: -.055em; }
    .hero-label { margin: 10px 0 28px; color: #bcccdc; }
    .metric { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 17px 0; border-top: 1px solid rgba(255,255,255,.13); }
    .metric span { color: #bcccdc; }
    .metric strong { font-size: 1.12rem; }
    .profit-status { margin-top: auto; border-radius: 15px; padding: 14px 16px; background: rgba(255,255,255,.08); color: #d9e2ec; font-size: .92rem; line-height: 1.55; }
    .profit-status strong { color: white; }
    .actions { display: flex; justify-content: flex-end; margin-top: 18px; }
    .reset {
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: #627d98;
      padding: 10px 12px;
      cursor: pointer;
    }
    .reset:hover { background: #edf2f7; color: var(--ink); }
    @media (max-width: 780px) {
      .page { width: min(100% - 20px, 620px); padding-top: 22px; }
      header { align-items: flex-start; flex-direction: column; gap: 10px; }
      .project-bar { grid-template-columns: 1fr; }
      .add-project { width: 100%; }
      .workspace { grid-template-columns: 1fr; border-radius: 20px; }
      .form-panel, .summary-panel { padding: 22px; }
      .summary-panel { min-height: 470px; }
    }
    @media (max-width: 480px) {
      .project-grid, .money-grid { grid-template-columns: 1fr; }
      .revenue { grid-column: auto; }
      .save-note { white-space: normal; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <p class="eyebrow">STARTUP LEDGER</p>
        <h1>创业利润表</h1>
      </div>
      <div class="save-note"><span class="save-dot"></span>内容自动保存在当前浏览器</div>
    </header>

    <nav class="project-bar" aria-label="创业项目列表">
      <div class="project-list" id="projectList"></div>
      <button class="add-project" id="addProject" type="button">＋ 新增项目</button>
    </nav>

    <section class="workspace" aria-label="创业利润计算器">
      <form class="form-panel" id="profitForm" autocomplete="off">
        <h2 class="section-title">项目信息</h2>
        <div class="project-grid">
          <label>项目名称
            <input id="projectName" type="text" placeholder="例如：手作咖啡品牌" maxlength="80">
          </label>
          <label class="upload" aria-label="上传项目图片">
            <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp">
            <span class="upload-copy"><span class="upload-icon">＋</span><strong>上传项目图片</strong><small>JPG、PNG 或 WebP</small></span>
            <img id="imagePreview" alt="项目图片预览">
          </label>
        </div>

        <h2 class="section-title">收支明细</h2>
        <div class="money-grid">
          <label class="field">成本一<span class="currency">¥</span><input id="cost1" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></label>
          <label class="field">成本二<span class="currency">¥</span><input id="cost2" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></label>
          <label class="field">成本三<span class="currency">¥</span><input id="cost3" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></label>
          <label class="field revenue">项目收益<span class="currency">¥</span><input id="revenue" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></label>
        </div>
        <div class="actions"><button class="reset" id="deleteButton" type="button">删除当前项目</button></div>
      </form>

      <aside class="summary-panel" aria-live="polite">
        <p class="summary-kicker">利润概览</p>
        <p class="summary-name" id="summaryName">未命名项目</p>
        <div class="portfolio-total">全部项目合计 <strong id="portfolioProfit">¥0.00</strong></div>
        <p class="hero-number" id="profitValue">¥0.00</p>
        <p class="hero-label">预计利润</p>
        <div class="metric"><span>总收益</span><strong id="revenueValue">¥0.00</strong></div>
        <div class="metric"><span>总成本</span><strong id="costValue">¥0.00</strong></div>
        <div class="metric"><span>利润率</span><strong id="marginValue">—</strong></div>
        <div class="profit-status" id="profitStatus"><strong>等待填写</strong><br>输入收益与成本后，这里会显示项目经营结果。</div>
      </aside>
    </section>
  </main>

  <script>
    const ids = ['projectName', 'cost1', 'cost2', 'cost3', 'revenue'];
    const fields = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));
    const money = new Intl.NumberFormat('zh-CN', { style: 'currency', currency: 'CNY', minimumFractionDigits: 2 });
    const storageKey = 'startup-profit-sheet-v2';
    let projects = [];
    let activeId = '';

    function newProject() {
      return { id: `${Date.now()}-${Math.random().toString(16).slice(2)}`, projectName: '', cost1: '', cost2: '', cost3: '', revenue: '', image: '' };
    }

    function currentProject() {
      return projects.find(project => project.id === activeId) || projects[0];
    }

    function valueOf(project, key) {
      const n = Number.parseFloat(project[key]);
      return Number.isFinite(n) && n >= 0 ? n : 0;
    }

    function projectProfit(project) {
      return valueOf(project, 'revenue') - valueOf(project, 'cost1') - valueOf(project, 'cost2') - valueOf(project, 'cost3');
    }

    function numberOf(input) {
      const n = Number.parseFloat(input.value);
      return Number.isFinite(n) && n >= 0 ? n : 0;
    }

    function save() {
      try { localStorage.setItem(storageKey, JSON.stringify({ projects, activeId })); } catch (_) {}
    }

    function renderProjectList() {
      const list = document.getElementById('projectList');
      list.replaceChildren(...projects.map((project, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `project-tab${project.id === activeId ? ' active' : ''}`;
        button.setAttribute('aria-current', project.id === activeId ? 'true' : 'false');
        const name = document.createElement('span');
        name.className = 'project-tab-name';
        name.textContent = project.projectName.trim() || `项目 ${index + 1}`;
        const profit = document.createElement('span');
        profit.className = 'project-tab-profit';
        profit.textContent = `利润 ${money.format(projectProfit(project))}`;
        button.append(name, profit);
        button.addEventListener('click', () => selectProject(project.id));
        return button;
      }));
    }

    function update() {
      const project = currentProject();
      if (!project) return;
      ids.forEach(id => { project[id] = fields[id].value; });
      const totalCost = numberOf(fields.cost1) + numberOf(fields.cost2) + numberOf(fields.cost3);
      const revenue = numberOf(fields.revenue);
      const profit = revenue - totalCost;
      const margin = revenue > 0 ? profit / revenue * 100 : null;
      document.getElementById('summaryName').textContent = fields.projectName.value.trim() || '未命名项目';
      document.getElementById('revenueValue').textContent = money.format(revenue);
      document.getElementById('costValue').textContent = money.format(totalCost);
      document.getElementById('profitValue').textContent = money.format(profit);
      document.getElementById('marginValue').textContent = margin === null ? '—' : `${margin.toFixed(1)}%`;
      document.getElementById('portfolioProfit').textContent = money.format(projects.reduce((sum, item) => sum + projectProfit(item), 0));
      const hero = document.getElementById('profitValue');
      hero.style.color = profit < 0 ? '#ff9aa6' : '#f5d795';
      const status = document.getElementById('profitStatus');
      if (!revenue && !totalCost) status.innerHTML = '<strong>等待填写</strong><br>输入收益与成本后，这里会显示项目经营结果。';
      else if (profit > 0) status.innerHTML = `<strong>项目盈利</strong><br>每投入 ¥1 成本，预计产生 ¥${(revenue / Math.max(totalCost, 1)).toFixed(2)} 收益。`;
      else if (profit < 0) status.innerHTML = `<strong>项目亏损</strong><br>还需增加 ${money.format(Math.abs(profit))} 收益才能达到盈亏平衡。`;
      else status.innerHTML = '<strong>盈亏平衡</strong><br>当前收益刚好覆盖全部成本。';
      renderProjectList();
      save();
    }

    function restore() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
        if (saved && Array.isArray(saved.projects) && saved.projects.length) {
          projects = saved.projects;
          activeId = projects.some(project => project.id === saved.activeId) ? saved.activeId : projects[0].id;
        }
      } catch (_) {}
      if (!projects.length) {
        const project = newProject();
        projects = [project];
        activeId = project.id;
      }
      selectProject(activeId);
    }

    function showImage(src) {
      const preview = document.getElementById('imagePreview');
      if (src) {
        preview.src = src;
        preview.style.display = 'block';
      } else {
        preview.removeAttribute('src');
        preview.style.display = 'none';
      }
    }

    function selectProject(id) {
      activeId = id;
      const project = currentProject();
      ids.forEach(key => { fields[key].value = project[key] || ''; });
      showImage(project.image || '');
      update();
    }

    document.getElementById('imageInput').addEventListener('change', event => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, 900 / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          const compressed = canvas.toDataURL('image/jpeg', .78);
          showImage(compressed);
          currentProject().image = compressed;
          save();
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });

    ids.forEach(id => fields[id].addEventListener('input', update));
    document.getElementById('addProject').addEventListener('click', () => {
      const project = newProject();
      projects.push(project);
      selectProject(project.id);
      fields.projectName.focus();
    });
    document.getElementById('deleteButton').addEventListener('click', () => {
      const project = currentProject();
      const label = project.projectName.trim() || '当前项目';
      if (!window.confirm(`确定要删除“${label}”吗？`)) return;
      projects = projects.filter(item => item.id !== project.id);
      if (!projects.length) projects.push(newProject());
      activeId = projects[0].id;
      selectProject(activeId);
    });
    restore();
  </script>
</body>
</html>
